<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f4f5f1">
<title>Asamblea · Ribera Campestre</title>
<style>
:root{--ink:#202c26;--muted:#78837b;--line:#e4e8e1;--green:#285640;--deep:#1d4432;--pale:#eaf2eb;--gold:#9a6836;--paper:#fff;--bg:#f4f5f1;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light}
*{box-sizing:border-box}body{margin:0;min-width:320px;background:var(--bg);color:var(--ink)}button,input,textarea{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed}a{color:inherit;text-decoration:none}
.shell{max-width:1250px;margin:auto;padding:0 36px 32px}.top{height:74px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px}.mark{width:37px;height:37px;border-radius:11px;background:var(--green);color:white;display:grid;place-items:center}.mark svg{width:21px}.brand b{font-size:12px;letter-spacing:.06em}.brand small{display:block;color:var(--muted);font-size:9px;letter-spacing:.11em;margin-top:4px}.top-right,.user{display:flex;align-items:center;gap:12px}.demo{font-size:8px;text-transform:uppercase;letter-spacing:.1em;font-weight:750;color:#68766b;border:1px solid var(--line);border-radius:99px;padding:7px 10px;background:#fff8}.user-copy{text-align:right;font-size:10px;font-weight:700}.user-copy small{display:block;color:var(--muted);font-size:9px;font-weight:500;margin-top:3px}.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#b98068;color:#fff;font-size:10px;font-weight:750}
.hero{padding:34px 0 22px;display:flex;align-items:flex-end;justify-content:space-between;gap:20px}.eyebrow{display:flex;align-items:center;gap:8px;font-size:9px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--green)}.eyebrow:before{content:"";height:1px;width:18px;background:#88a18c}h1{font-size:clamp(31px,4vw,45px);letter-spacing:-.06em;line-height:1.05;margin:12px 0 8px;font-weight:650}.hero p{font-size:11px;color:var(--muted);margin:0}.place{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff9;border-radius:9px;padding:9px 12px;font-size:9px;font-weight:650;color:#58665d;white-space:nowrap}.place svg{width:15px;color:var(--green)}
.switch{display:flex;width:max-content;background:#e9ece6;padding:4px;border-radius:10px;margin:0 0 16px}.switch button{border:0;background:transparent;padding:9px 14px;border-radius:7px;color:#6c7870;font-size:9px;font-weight:750;display:flex;align-items:center;gap:7px}.switch button.active{background:#fff;color:var(--green);box-shadow:0 2px 8px #25392c14}.switch svg{width:14px}
.grid{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(255px,.8fr);gap:15px;align-items:start}.col{display:grid;gap:14px;min-width:0}.card{background:var(--paper);border:1px solid var(--line);border-radius:13px;box-shadow:0 3px 13px #24392c06}.pad{padding:18px}.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:15px}.kicker{font-size:8px;text-transform:uppercase;letter-spacing:.12em;color:#89938b;font-weight:800;margin-bottom:5px}.head h2{font-size:13px;letter-spacing:-.02em;margin:0 0 5px}.head p{font-size:9px;line-height:1.5;color:var(--muted);margin:0}
.pill{border-radius:99px;padding:6px 9px;font-size:8px;font-weight:750;white-space:nowrap}.pill:before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:currentColor;margin-right:6px;vertical-align:1px}.active-pill{background:#edf5eb;color:#32714e}.off-pill{background:#eff1ed;color:#707b73}.soon-pill{background:#f8f0e4;color:var(--gold)}
.empty{min-height:260px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px}.empty-icon{width:45px;height:45px;background:#f0f3ee;color:#69816e;border-radius:14px;display:grid;place-items:center;margin-bottom:14px}.empty-icon svg{width:21px}.empty h2{font-size:16px;letter-spacing:-.035em;margin:0 0 8px}.empty p{font-size:10px;line-height:1.6;color:var(--muted);max-width:390px;margin:0}
.ballot{padding:21px}.ballot-top{display:flex;justify-content:space-between;align-items:center}.ballot-label{font-size:8px;text-transform:uppercase;letter-spacing:.12em;color:#89938b;font-weight:800}.ballot h2{font-size:20px;line-height:1.25;letter-spacing:-.04em;margin:13px 0 7px}.ballot-intro{font-size:10px;color:var(--muted);line-height:1.5;margin:0}.coef{display:flex;justify-content:space-between;align-items:center;margin-top:16px;padding:10px 12px;border-radius:9px;background:#f5f7f3;color:#657269;font-size:9px}.coef strong{color:var(--green);font-size:12px}.choices{display:grid;gap:7px;margin-top:14px}.choice{width:100%;display:flex;align-items:center;gap:10px;text-align:left;background:#fff;border:1px solid var(--line);border-radius:9px;padding:12px;color:var(--ink);transition:.15s}.choice:hover{border-color:#a8bba9;background:#fbfdfb}.choice.sel{background:#f1f7f1;border-color:var(--green);box-shadow:inset 0 0 0 1px var(--green)}.radio{width:15px;height:15px;border:1.5px solid #aeb8af;border-radius:50%;display:grid;place-items:center;flex:none}.choice.sel .radio{border-color:var(--green)}.choice.sel .radio:after{content:"";width:6px;height:6px;border-radius:50%;background:var(--green)}.choice span:last-child{font-size:10px;font-weight:650}.ballot-actions{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px}.hint{font-size:8px;line-height:1.45;color:#879189}.btn{border:0;border-radius:7px;padding:10px 13px;font-size:9px;font-weight:750;transition:.15s}.primary{color:white;background:var(--green)}.primary:hover{background:var(--deep)}.primary:disabled{opacity:.42}.danger{background:#a44b43;color:white}.danger:hover{background:#873e38}.soft{background:#edf4ed;color:var(--green);border:1px solid #e1ebe1}.soft:hover{background:#e2eee3}.submitted{padding:11px 12px;border-radius:8px;background:#edf5eb;color:#356b4c;font-size:9px;line-height:1.5;font-weight:650;margin-top:14px}
.info{padding:16px}.info-title{font-size:10px;font-weight:750;margin-bottom:12px}.unit-summary{display:flex;align-items:center;gap:11px}.big{width:51px;height:51px;border-radius:50%;background:var(--pale);color:var(--green);display:grid;place-items:center;font-weight:800;font-size:12px;flex:none}.unit-summary strong{display:block;font-size:10px;margin-bottom:4px}.unit-summary span{font-size:8px;line-height:1.4;color:var(--muted)}.notice{font-size:8px;line-height:1.55;color:#78857b;border-left:2px solid #bdcdbd;padding:3px 0 3px 10px}.notice strong{color:#56665a}
.admin-hero{padding:19px;background:var(--green);color:#fff;border:0;position:relative;overflow:hidden}.admin-hero:after{content:"";position:absolute;width:175px;height:175px;right:-25px;top:-113px;border:1px solid #ffffff29;border-radius:50%;box-shadow:0 0 0 21px #ffffff10,0 0 0 42px #ffffff09}.admin-hero .kicker{color:#c7d6c8;position:relative}.admin-hero h2{font-size:15px;letter-spacing:-.03em;margin:7px 0}.admin-hero p{font-size:9px;line-height:1.5;color:#d8e3da;margin:0;max-width:470px}.admin-hero .pill{position:absolute;right:15px;top:15px;z-index:1}.controls{display:flex;gap:7px;margin-top:13px;position:relative;z-index:1}.controls .primary{background:#dce9af;color:#243b2e}.controls .primary:hover{background:#ebf3cf}.controls .danger{background:#fff;color:#94453e}
.queue{display:grid;gap:6px}.qrow{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px;padding:9px;border:1px solid #e8ebe5;border-radius:8px}.qrow.selected{background:#f7fbf6;border-color:#aabdaa}.qselect{border:0;background:none;padding:0;text-align:left;color:var(--ink);font-size:9px;font-weight:700;line-height:1.4}.qselect small{display:block;color:#89938b;font-size:8px;font-weight:500;margin-top:4px}.qtools{display:flex;align-items:center;gap:6px}.qstatus{color:#79847b;font-size:8px}.qaction{border:0;background:#edf4ed;color:var(--green);border-radius:5px;padding:6px 8px;font-size:8px;font-weight:750}.blank{padding:13px;border:1px dashed #dfe5dd;color:#879188;font-size:9px;line-height:1.5;border-radius:8px}.form-group{margin-bottom:11px}.form-group label,.form-label{display:block;font-size:8px;font-weight:750;color:#5d6a61;margin-bottom:6px}.field{width:100%;border:1px solid #dfe5dd;border-radius:7px;padding:9px 10px;color:var(--ink);font-size:9px;outline:none;background:#fff}.field:focus{border-color:#7e9d83;box-shadow:0 0 0 3px #dfeade}.field::placeholder{color:#aab2aa}textarea.field{resize:vertical;min-height:52px;line-height:1.5}
.option-list{display:grid;gap:6px}.option-edit{display:flex;align-items:center;gap:6px}.option-letter{width:17px;flex:none;font-size:8px;color:#89938b;font-weight:750}.option-edit input{flex:1}.remove{width:28px;height:30px;border:1px solid #e8eae5;background:white;border-radius:6px;color:#849087;font-size:13px}.remove:hover{color:#a44b43}.remove:disabled{opacity:.35}.add{border:0;background:none;color:var(--green);padding:7px 0;font-size:8px;font-weight:750}.form-actions{display:flex;align-items:center;justify-content:space-between;gap:7px;margin-top:8px}.error{display:none;color:#a44b43;font-size:8px;margin-top:7px}.error.show{display:block}
.attendee{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid #f0f2ee}.attendee:last-child{border:0}.attendee label{display:flex;gap:7px;align-items:center;font-size:8px;font-weight:650}.attendee input{accent-color:var(--green);width:13px;height:13px;margin:0}.attendee small{font-size:7px;color:#89938b;font-weight:500}.attendee b{font-size:8px;color:var(--green)}
.meterrow{display:flex;justify-content:space-between;gap:8px;align-items:center}.meterrow strong{font-size:10px}.meterrow span,.caption{font-size:8px;color:var(--muted)}.meter{height:7px;border-radius:99px;background:#edf0eb;overflow:hidden;margin:8px 0}.fill{height:100%;border-radius:99px;background:var(--green);transition:width .22s}.results{display:grid;gap:11px}.result{display:grid;grid-template-columns:minmax(80px,1fr) 1.6fr auto;gap:8px;align-items:center}.result-label{font-size:8px;font-weight:650;overflow-wrap:anywhere}.track{height:7px;border-radius:99px;background:#edf0eb;overflow:hidden}.result-fill{height:100%;border-radius:99px;background:#729478}.result-value{font-size:8px;font-weight:750;color:var(--green);white-space:nowrap;text-align:right}
footer{display:flex;justify-content:space-between;gap:15px;padding:20px 1px 0;color:#879189;font-size:8px;line-height:1.5}.footnote{text-align:right;max-width:600px}.toast{position:fixed;z-index:5;bottom:20px;left:50%;transform:translate(-50%,14px);opacity:0;pointer-events:none;background:#203a2d;color:white;padding:10px 14px;border-radius:8px;font-size:9px;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}:focus-visible{outline:3px solid #9ab48f;outline-offset:2px}
@media(max-width:850px){.shell{padding-left:22px;padding-right:22px}.grid{grid-template-columns:minmax(0,1.35fr) minmax(230px,.8fr);gap:11px}.pad{padding:15px}}
@media(max-width:680px){.shell{padding:0 15px 25px}.top{height:65px}.demo{display:none}.user-copy{display:none}.hero{padding:26px 0 18px;align-items:flex-start;flex-direction:column;gap:12px}h1{font-size:35px}.grid{grid-template-columns:1fr}.switch{width:100%}.switch button{flex:1;justify-content:center}.admin-hero{min-height:160px}.ballot{padding:17px}footer{flex-direction:column}.footnote{text-align:left}.result{grid-template-columns:minmax(75px,1fr) 1.3fr auto}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

  <div id="root"></div>
  <script type="module" src="/main.tsx"></script>
</body>
</html>
